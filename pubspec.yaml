name: meetksa_customer
description: "MeetKSA Customer - Production Mobile Shell for MeetKSA Customer Web Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.16.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  google_fonts: ^6.2.1
  geolocator: ^13.0.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/splash/
    - assets/images/illustrations/
    - assets/icons/
    - assets/animations/
