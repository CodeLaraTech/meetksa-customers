name: Build iOS & Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA & Android Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK & AppBundle
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Build iOS App / IPA (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MeetKSA_Customer_v1.0.0.ipa Payload
          rm -rf Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetKSA_Customer_iOS_IPA
          path: MeetKSA_Customer_v1.0.0.ipa

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeetKSA_Customer_Android_Release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
